<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Artist Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            background: #282828;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: #1db954;
            border: 2px solid #333;
        }
        .artist-name {
            font-size: 1.6rem;
            margin-bottom: 5px;
        }
        .artist-genre {
            font-size: 0.9rem;
            color: #b3b3b3;
            margin-bottom: 30px;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .link-btn {
            background-color: #282828;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background 0.2s, transform 0.2s;
            border: 1px solid #3e3e3e;
        }
        .link-btn:hover {
            background-color: #383838;
            transform: scale(1.02);
            border-color: #1db954;
        }
        .link-btn i {
            font-size: 1.2rem;
        }
        .contact-box {
            background-color: #181818;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #282828;
            margin-bottom: 20px;
        }
        .contact-box h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #b3b3b3;
        }
        .email-link {
            color: #1db954;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
        }
        footer {
            font-size: 0.75rem;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto Profil / Icon -->
        <div class="profile-img">
            <i class="fa-solid fa-microphone-lines"></i>
        </div>

        <h1 class="artist-name">Nama Artis Baru</h1>
        <p class="artist-genre">Singer • Songwriter</p>

        <!-- Link Platform Streaming & Social Media -->
        <div class="links-list">
            <a href="https://spotify.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-spotify"></i> Listen on Spotify
            </a>
            <a href="https://music.apple.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-apple"></i> Apple Music
            </a>
            <a href="https://youtube.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-youtube"></i> YouTube Music
            </a>
            <a href="https://instagram.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="https://tiktok.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
        </div>

        <!-- Kontak / Booking -->
        <div class="contact-box">
            <h3>Management & Contact</h3>
            <a href="mailto:email@domain.com" class="email-link">
                <i class="fa-solid fa-envelope"></i> email@domain.com
            </a>
        </div>

        <footer>
            <p>&copy; 2026 Nama Artis Baru. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        // JavaScript sederhana
        document.addEventListener("DOMContentLoaded", () => {
            console.log("Single-file Artist Page Loaded Successfully.");
        });
    </script>
</body>
</html>
